<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battle on the DS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=M+PLUS+Rounded+1c:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
img.px{image-rendering:pixelated}
button:focus-visible{outline:3px solid #E2B84B;outline-offset:2px}
</style>
</helmet>
<div style="width: 480px; height: 760px; box-sizing: border-box; font-family: DotGothic16, monospace; color: #1C2030; display: flex; flex-direction: column;">

<div style="background: #A7ADB9; border-radius: 26px 26px 10px 10px; padding: 18px 24px 16px; border: 2px solid #6F7684; box-shadow: inset 0 2px 0 #C9CED6;">
<div style="background: #23262E; border-radius: 10px; padding: 0;">
<div style="position: relative; width: 432px; height: 324px; overflow: hidden; border-radius: 4px; background: #E9E4F0;">
<img class="px" src="/_blob/a8742a752edc60e2d9ad62b6976b70c5" alt="" width="432" height="324" style="position: absolute; left: 0; top: 0;">
<img class="px" src="{{s.foeImg}}" alt="{{s.foeName}}" width="160" height="160" style="position: absolute; left: 244px; top: 12px;">
<img class="px" src="{{s.myImg}}" alt="{{s.myName}}, seen from behind" width="176" height="176" style="position: absolute; left: 20px; top: 112px;">

<div style="position: absolute; left: 10px; top: 12px; width: 196px; background: #FAFAF7; border: 2px solid #2E3440; border-radius: 8px 2px 8px 2px; padding: 6px 10px; box-sizing: border-box;">
<div style="display: flex; justify-content: space-between; font-size: 14px;"><span>{{s.foeName}}</span><span>Lv100</span></div>
<div style="display: flex; align-items: center; gap: 4px; margin-top: 4px;"><span style="font-size: 10px; background: #E2B84B; padding: 0 3px; border-radius: 2px;">HP</span><div style="flex: 1 1 auto; height: 6px; background: #3A4558; border-radius: 3px; padding: 1px;"><div style="width: {{s.foeW}}; height: 100%; background: {{s.foeBar}}; border-radius: 2px;"></div></div></div>
<div style="display: flex; gap: 3px; margin-top: 5px;">
<sc-for list="{{s.herBalls}}" as="b" hint-placeholder-count="6"><span style="width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #2E3440; background: {{b.c}};"></span></sc-for>
</div>
</div>

<div style="position: absolute; right: 10px; top: 166px; width: 206px; background: #FAFAF7; border: 2px solid #2E3440; border-radius: 2px 8px 2px 8px; padding: 6px 10px; box-sizing: border-box;">
<div style="display: flex; justify-content: space-between; font-size: 14px;"><span>{{s.myName}}</span><span>Lv100</span></div>
<div style="display: flex; align-items: center; gap: 4px; margin-top: 4px;"><span style="font-size: 10px; background: #E2B84B; padding: 0 3px; border-radius: 2px;">HP</span><div style="flex: 1 1 auto; height: 6px; background: #3A4558; border-radius: 3px; padding: 1px;"><div style="width: {{s.myW}}; height: 100%; background: {{s.myBar}}; border-radius: 2px;"></div></div></div>
<div style="text-align: right; font-size: 13px; margin-top: 2px;">{{s.myHp}}</div>
</div>

<div style="position: absolute; left: 6px; right: 6px; bottom: 6px; height: 62px; background: #FAFAF7; border: 3px solid #4A5468; border-radius: 8px; box-shadow: inset 0 0 0 2px #C9D2E3; padding: 10px 14px; box-sizing: border-box; font-size: 16px; line-height: 1.4;">{{s.msg}}</div>
</div>
</div>
</div>

<div style="height: 26px; margin: 0 14px; background: #8F96A4; border-left: 2px solid #6F7684; border-right: 2px solid #6F7684; display: flex; align-items: center; justify-content: center; gap: 6px;" aria-hidden="true">
<span style="width: 70px; height: 6px; border-radius: 3px; background: #6F7684;"></span>
</div>

<div style="background: #A7ADB9; border-radius: 10px 10px 26px 26px; padding: 16px 24px 18px; border: 2px solid #6F7684; flex: 1 1 auto;">
<div style="background: #23262E; border-radius: 10px;">
<div style="width: 432px; height: 324px; box-sizing: border-box; border-radius: 4px; background: #2C3045; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex: 1 1 auto;">
<sc-for list="{{s.moves}}" as="m" hint-placeholder-count="4">
<button type="button" style="font: inherit; text-align: left; cursor: pointer; border-radius: 12px; border: 3px solid {{m.edge}}; background: {{m.bg}}; color: {{m.fg}}; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.18);">
<span style="font-size: 18px;">{{m.n}}</span>
<span style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%; font-size: 13px;"><span>{{m.type}} PP {{m.pp}}</span><span style="background: #FAFAF7; color: #1C2030; border-radius: 6px; padding: 2px 7px; font-size: 14px;">{{m.dmg}}</span></span>
</button>
</sc-for>
</div>
<button type="button" style="font: inherit; cursor: pointer; height: 58px; border-radius: 12px; border: 3px solid #1C2030; background: #E2B84B; color: #1C2030; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.18);">
<span style="font-size: 18px;">Switch</span>
<span style="display: flex; gap: 6px;"><sc-for list="{{s.myBalls}}" as="b" hint-placeholder-count="6"><span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1C2030; background: {{b.c}};"></span></sc-for></span>
</button>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":null},"$preview":{"width":480,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const up = { c: '#FAFAF7' };
    const start = {
      foeImg: '/_blob/1dd060717cee2af7d07ff9d9fa20e61a', foeName: 'Spiritomb', foeW: '100%', foeBar: '#48C058',
      myImg: '/_blob/dce9a98b4a3e2fb514c34818a7244e62', myName: 'Weavile', myW: '100%', myBar: '#48C058', myHp: '302/ 302',
      msg: 'Cynthia sent out Spiritomb! What will Weavile do?',
      herBalls: [up, up, up, up, up, up],
      myBalls: [up, up, up, up, up, up],
      moves: [
        { n: 'Night Slash', type: 'Dark', pp: '24/24', dmg: '32-38%', bg: '#705848', edge: '#4A3A2F', fg: '#FFFFFF' },
        { n: 'Ice Punch', type: 'Ice', pp: '24/24', dmg: '29-34%', bg: '#98D8D8', edge: '#5E9C9C', fg: '#1C2030' },
        { n: 'Low Kick', type: 'Fighting', pp: '32/32', dmg: 'No effect', bg: '#C03028', edge: '#7E1F1A', fg: '#FFFFFF' },
        { n: 'Swords Dance', type: 'Normal', pp: '32/32', dmg: 'Atk +2', bg: '#A8A878', edge: '#6D6D4E', fg: '#1C2030' }
      ]
    };
    return { s: this.props.state ?? start };
  }
}
</script>
</body>
</html>
